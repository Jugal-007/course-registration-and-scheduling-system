<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRSS - Secure Student Access</title>
  <style>
    :root {
      --brand-primary: #047857;
      --brand-hover: #065f46;
      --surface-bg: #f8fafc;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --border-line: #cbd5e1;
      --warning-bg: #fef3c7;
      --warning-border: #f59e0b;
      --warning-text: #92400e;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--surface-bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .auth-card {
      background: var(--panel-bg);
      padding: 2.25rem;
      border-radius: 10px;
      border: 1px solid var(--border-line);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 440px;
    }
    .security-notice {
      background-color: var(--warning-bg);
      border-left: 4px solid var(--warning-border);
      color: var(--warning-text);
      padding: 0.85rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      line-height: 1.4;
      border-radius: 4px;
    }
    .input-field {
      margin-bottom: 1.25rem;
    }
    .input-field label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .input-field input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-line);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .input-field input:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.15);
    }
    .helper-text {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.35rem;
    }
    .submit-btn {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--brand-primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    .submit-btn:hover {
      background-color: var(--brand-hover);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h2>Academic Portal Login</h2>
    <div class="security-notice">
      <strong>Security Policy (FR-02):</strong> Accounts will automatically lock for 15 minutes after 5 consecutive unsuccessful login attempts.
    </div>
    <form id="authForm" action="/api/v1/auth/login" method="POST" novalidate>
      <div class="input-field">
        <label for="studentId">Enrollment PRN / Student ID</label>
        <input type="text" id="studentId" name="studentId" pattern="[0-9]{2}[A-Za-z]{1}[0-9]{5}" required placeholder="Format: 24C21000">
        <div class="helper-text">Enter your 8-character official university registration number.</div>
      </div>
      <div class="input-field">
        <label for="password">Encrypted Portal Password</label>
        <input type="password" id="password" name="password" minlength="8" required placeholder="Minimum 8 characters">
        <div class="helper-text">Password must include uppercase, lowercase, number, and symbol.</div>
      </div>
      <button type="submit" class="submit-btn">Authenticate &amp; Continue</button>
    </form>
  </div>
</body>
</html>
